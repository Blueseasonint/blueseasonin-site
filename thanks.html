<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Thank you | Blue Season International Ltd.</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
  <style>
    :root{--navy:#071a33;--gold:#c8a45d;--gold-2:#d8b870}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#06172e 0%,#0a2344 55%,#071a33 100%);line-height:1.6;text-align:center}
    .box{max-width:560px}
    img{width:84px;height:84px;object-fit:contain;margin-bottom:22px}
    h1{font-size:clamp(30px,5vw,44px);line-height:1.15;margin:0 0 14px;color:var(--gold-2)}
    p{color:rgba(255,255,255,.82);font-size:18px;margin:0 0 28px}
    a.btn{display:inline-block;background:var(--gold);color:var(--navy);padding:13px 24px;border-radius:999px;font-weight:800;text-decoration:none}
    a.btn:focus-visible{outline:3px solid var(--gold-2);outline-offset:3px}
  </style>
</head>
<body>
  <main class="box">
    <img src="assets/blue-season-symbol.webp" alt="Blue Season International logo" width="84" height="84">
    <h1>Thank you. We received your request.</h1>
    <p>We aim to get back to every enquiry within one business day.</p>
    <a class="btn" href="index.html">Back to the website</a>
  </main>
</body>
</html>
